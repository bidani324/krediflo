<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg-glow-m" cx="38%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kflow-m" x1="156" y1="256" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="ds-m" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00D2FF" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Full-bleed background (maskable — OS applies shape mask) -->
  <rect width="512" height="512" fill="#0F172A"/>
  <rect width="512" height="512" fill="url(#bg-glow-m)"/>

  <!--
    Maskable safe zone: inner 80% = 51.2px padding on each side.
    Content centred between x:72–440, y:80–432.
  -->

  <!-- K vertical stroke -->
  <line x1="156" y1="100" x2="156" y2="412" stroke="white" stroke-width="56" stroke-linecap="round" filter="url(#ds-m)"/>

  <!-- K upper diagonal -->
  <line x1="156" y1="256" x2="380" y2="100" stroke="white" stroke-width="56" stroke-linecap="round"/>

  <!-- K lower diagonal — white-to-cyan flow curve -->
  <path d="M156 256 Q262 316 380 412" stroke="url(#kflow-m)" stroke-width="56" stroke-linecap="round" fill="none"/>

  <!-- Wave accent -->
  <path d="M120 450 Q200 432 280 450 Q336 462 392 450" stroke="#00D2FF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
