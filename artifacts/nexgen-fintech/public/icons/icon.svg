<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg-glow" cx="38%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kflow-icon" x1="130" y1="256" x2="400" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00D2FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Navy background with rounded corners -->
  <rect width="512" height="512" rx="88" fill="#0F172A"/>
  <rect width="512" height="512" rx="88" fill="url(#bg-glow)"/>

  <!-- Subtle grid lines for fintech feel -->
  <line x1="0" y1="256" x2="512" y2="256" stroke="#00D2FF" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#00D2FF" stroke-opacity="0.05" stroke-width="1"/>

  <!-- K vertical stroke -->
  <line x1="130" y1="108" x2="130" y2="404" stroke="white" stroke-width="62" stroke-linecap="round" filter="url(#drop-shadow)"/>

  <!-- K upper diagonal -->
  <line x1="130" y1="256" x2="400" y2="108" stroke="white" stroke-width="62" stroke-linecap="round"/>

  <!-- K lower diagonal — white-to-cyan flow curve -->
  <path d="M130 256 Q252 318 400 404" stroke="url(#kflow-icon)" stroke-width="62" stroke-linecap="round" fill="none"/>

  <!-- Wave accent at bottom -->
  <path d="M96 456 Q192 430 288 456 Q352 472 416 456" stroke="#00D2FF" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
