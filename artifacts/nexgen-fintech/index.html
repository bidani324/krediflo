<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- ── Primary SEO ─────────────────────────────────────────────────────── -->
    <title>Krediflo | Seamless Credit &amp; Data Flow</title>
    <meta name="description" content="API-first loan aggregator. CIBIL, MCA, and Account Aggregator bank statements — all synced in seconds. Apply for Home, LAP, Business, or Personal loans from 40+ bank partners." />
    <meta name="keywords" content="home loan, loan against property, business loan, personal loan, CIBIL, balance transfer, Krediflo" />
    <meta name="author" content="Krediflo" />
    <meta name="robots" content="index, follow" />

    <!-- ── PWA Manifest ────────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── PWA: Android / Chrome ───────────────────────────────────────────── -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Krediflo" />

    <!-- ── PWA: iOS / Safari ───────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Krediflo" />
    <link rel="apple-touch-icon" href="/icons/icon-maskable.svg" />

    <!-- ── PWA: Windows ────────────────────────────────────────────────────── -->
    <meta name="msapplication-TileColor" content="#0F172A" />
    <meta name="msapplication-TileImage" content="/icons/icon.svg" />
    <meta name="msapplication-config" content="none" />

    <!-- ── Open Graph ──────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krediflo" />
    <meta property="og:title" content="Krediflo | Seamless Credit &amp; Data Flow" />
    <meta property="og:description" content="CIBIL, MCA, and Account Aggregator bank data synced in seconds. Compare 40+ lenders and apply online." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:url" content="https://krediflo.com" />
    <link rel="canonical" href="https://krediflo.com/" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter Card ────────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Krediflo | Seamless Credit &amp; Data Flow" />
    <meta name="twitter:description" content="API-first loan aggregator. CIBIL, MCA, and Account Aggregator — all in one platform. krediflo.com" />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <!-- ── Favicon ─────────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/icon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- ── Fonts ───────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
